services:
  db:
    image: postgres:16-alpine
    container_name: medicor-db
    environment:
      POSTGRES_USER: medicor
      POSTGRES_PASSWORD: medicor
      POSTGRES_DB: medicor
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - medicor_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicor -d medicor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: medicor-backend
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://medicor:medicor@db:5432/medicor
    expose:
      - "5001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: medicor-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  medicor_pgdata:
